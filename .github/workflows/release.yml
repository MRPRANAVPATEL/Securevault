name: Build SecureVault signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build the release APK
        run: gradle assembleRelease --stacktrace

      - name: Sign and verify the release APK
        shell: bash
        env:
          SECUREVAULT_KEYSTORE_BASE64: ${{ secrets.SECUREVAULT_KEYSTORE_BASE64 }}
          SECUREVAULT_KEYSTORE_PASSWORD: ${{ secrets.SECUREVAULT_KEYSTORE_PASSWORD }}
          SECUREVAULT_KEY_ALIAS: ${{ secrets.SECUREVAULT_KEY_ALIAS }}
          SECUREVAULT_KEY_PASSWORD: ${{ secrets.SECUREVAULT_KEY_PASSWORD }}
        run: |
          if [[ -z "$SECUREVAULT_KEYSTORE_BASE64" || -z "$SECUREVAULT_KEYSTORE_PASSWORD" ||
                -z "$SECUREVAULT_KEY_ALIAS" || -z "$SECUREVAULT_KEY_PASSWORD" ]]; then
            echo "::error::Set the four SecureVault signing secrets listed in README.md."
            exit 1
          fi

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/securevault-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$SECUREVAULT_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"

          tools_dir="$ANDROID_HOME/build-tools/34.0.0"
          release_dir="app/build/outputs/apk/release"
          signed_apk="$release_dir/SecureVault-release.apk"
          "$tools_dir/zipalign" -f 4 "$release_dir/app-release-unsigned.apk" "$signing_dir/aligned.apk"
          "$tools_dir/apksigner" sign \
            --ks "$signing_dir/release.jks" \
            --ks-key-alias "$SECUREVAULT_KEY_ALIAS" \
            --ks-pass env:SECUREVAULT_KEYSTORE_PASSWORD \
            --key-pass env:SECUREVAULT_KEY_PASSWORD \
            --out "$signed_apk" "$signing_dir/aligned.apk"
          "$tools_dir/apksigner" verify --verbose --print-certs "$signed_apk"
          "$tools_dir/zipalign" -c 4 "$signed_apk"

      - name: Upload the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-release-apk
          path: app/build/outputs/apk/release/SecureVault-release.apk
          if-no-files-found: error
